name: VPhoneRemote
options:
  bundleIdPrefix: com.vphone.remote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "KPZ9FHAHFP"
    CODE_SIGN_STYLE: "Automatic"
targets:
  VPhoneRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: VPhone Remote
        NSLocalNetworkUsageDescription: "VPhone Remote connects to your Mac's vphone bridge on your local network or Tailscale tailnet."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vphone.remote.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
